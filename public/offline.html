<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Hors connexion — Gestion Scolaire</title>
<style>
  :root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--fg:#0f172a;--muted:#64748b;--b:#e2e8f0}
  @media (prefers-color-scheme:dark){:root{--bg:#121a2b;--card:#1c2740;--fg:#f1f5f9;--muted:#b3c0d4;--b:#33415c}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
  .card{max-width:380px;width:100%;text-align:center;background:var(--card);border:1px solid var(--b);border-radius:20px;padding:32px 24px;
        box-shadow:0 10px 30px -12px rgba(15,23,42,.25)}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:19px;margin:18px 0 6px}
  p{margin:0 0 4px;color:var(--muted)}
  p[dir=rtl]{font-size:14px}
  button{margin-top:22px;border:0;border-radius:12px;padding:11px 22px;font:600 15px system-ui,sans-serif;color:#fff;
         background:linear-gradient(135deg,#6366f1,#4338ca);cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Pas de connexion Internet</h1>
    <p>Vérifiez votre connexion puis réessayez.</p>
    <p dir="rtl">لا يوجد اتصال بالإنترنت</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>addEventListener("online",()=>location.reload())</script>
</body>
</html>
